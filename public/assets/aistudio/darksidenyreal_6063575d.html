    pool.forEach(candidate => {

        recent.forEach((item, index) => {
            if (item.number === candidate) matchingIndexes.push(index);
        });
        const count = matchingIndexes.length;
        const recentIndex = count ? matchingIndexes[0] : Infinity;
        if (
            count > bestCount ||
